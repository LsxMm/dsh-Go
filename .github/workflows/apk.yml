name: APK

# Builds an installable arm64 APK on a GitHub runner, because the phone cannot:
# upstream ships Flutter for x86_64 only, so `flutter build apk` cannot run in
# the proot guest at all. The bundled runtime (rootfs + proot .so) is taken from
# the upstream release APK instead of rebuilding it with runtime/build-runtime.sh,
# which keeps the job to a few minutes.
on:
  workflow_dispatch:
    inputs:
      build_name:
        description: Version name; empty uses app/pubspec.yaml
        required: false
        default: ''
  push:
    branches: ['build/apk']

permissions:
  contents: read

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.7
  GRADLE_VERSION: 9.3.1
  TZ: Asia/Shanghai
  # The runtime bundle is versioned data, not code: it is identical for any build
  # of the same runtime revision. Taking it from the release avoids a 20-minute
  # Ubuntu+Node+DSH download on every build.
  RUNTIME_APK: https://github.com/ccch1mneyyy/dsh-Go/releases/download/v1.0.13/dsh-go-1.0.13-arm64.apk

jobs:
  apk:
    name: arm64 APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Runtime assets from the upstream release
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/upstream.apk" "$RUNTIME_APK"
          sha256sum "$RUNNER_TEMP/upstream.apk"
          install -d runtime/out/arm64-v8a/assets runtime/out/arm64-v8a/jniLibs/arm64-v8a
          cd runtime/out/arm64-v8a
          unzip -o -q "$RUNNER_TEMP/upstream.apk" 'assets/runtime/*'
          unzip -o -q "$RUNNER_TEMP/upstream.apk" 'lib/arm64-v8a/*' -d "$RUNNER_TEMP/lib"
          cp "$RUNNER_TEMP"/lib/lib/arm64-v8a/*.so jniLibs/arm64-v8a/
          ls -l assets/runtime jniLibs/arm64-v8a
      - name: Flutter plugins and local.properties
        working-directory: app
        run: |
          flutter pub get --enforce-lockfile
          printf 'sdk.dir=%s\nflutter.sdk=%s\n' "$ANDROID_HOME" "$FLUTTER_ROOT" > android/local.properties
      - name: Release signing key
        working-directory: app/android
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [[ -z "$KEYSTORE_B64" ]]; then
            echo "::error::KEYSTORE_B64 is empty; the APK would fall back to debug signing"
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > release.jks
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$PWD/release.jks" "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > key.properties
          chmod 600 release.jks key.properties
          keytool -list -keystore release.jks -storepass "$KEYSTORE_PASSWORD" | tail -2
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
      - name: Unit tests
        working-directory: app/android
        env:
          DSH_MAVEN_MIRRORS: 0
        run: gradle --stacktrace :app:testArm64DebugUnitTest
      - name: Build the APK
        env:
          DSH_MAVEN_MIRRORS: 0
        run: |
          args=(--release -f arm64)
          [[ -n "${{ inputs.build_name }}" ]] && args+=(--build-name "${{ inputs.build_name }}")
          bash tooling/build-apk.sh "${args[@]}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dsh-go-arm64
          path: app/build/app/outputs/flutter-apk/app-arm64-release.apk
          if-no-files-found: error
          retention-days: 14
